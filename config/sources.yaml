sources:
  - id: demo
    type: local_folder
    root: ../examples/corpus/demo
    include:
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.pptx"
      - "**/*.xlsx"
      - "**/*.txt"
      - "**/*.md"
    exclude:
      - "**/~$*"
      - "**/.*/**"

